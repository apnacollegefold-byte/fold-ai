    <script
        async
        crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_d29ydGh5LWhhbXN0ZXItMTUuY2xlcmsuYWNjb3VudHMuZGV2JA"

<body>

    <!-- ============================================================ -->

    <!-- ============================================================ -->
    <!-- AUTH SCREEN (shown when logged out)                          -->

    <template id="tpl-landing">
        <section class="page landing-page">
            
            <!-- SECTION 2: Hero Section -->
            <div class="hero-section">
                <!-- Introductory Text -->
                <div class="hero-intro">
                    <h2 class="hero-intro-title">It's just money, after-all.</h2>

                <!-- Animated Coin Container (3D Flip Effect) -->

                    <div class="coin">

                        <img src="/assests/coin2.png" alt="Indian Rupee Coin Back" class="coin-face coin-back">

                </div>

                <!-- Main Hero Grid Column split -->
                <div class="hero-main-grid">
                    <div class="hero-content">
                        <h1>Stop recording expenses manually.</h1>
                        <p class="hero-desc">Fold automatically categorizes your expenses. Upload receipts, record voice notes, or simply type. Focus on what matters.</p>
                        <a href="#chat" class="btn primary btn-hero-cta">Start Tracking →</a>
                    </div>
                    <div class="hero-visual">
                        <div class="hero-image-wrapper">

                        </div>
                    </div>

            <!-- SECTION 3: How It Works (Zigzag Flow) -->
            <div class="how-it-works-section">
                <div class="section-header">
                    <h2>Track spending in 30 seconds.</h2>
                    <p class="section-subheader">Fold turns messy receipts, UPI screenshots, and quick voice notes into clean, categorized transactions.</p>
                </div>

                <!-- Step 1: Add Expense (Image Left, Text Right) -->
                <div class="step-card zigzag-step">
                    <div class="step-visual">
                        <span class="step-badge">01</span>
                        <img src="/assests/expense.png" alt="Upload and capture screen mockup" class="step-img">
                    </div>
                    <div class="step-content">
                        <h3>Add an expense</h3>
                        <p>Type, upload an image, or record audio. Hinglish is supported. Fold extracts details instantly.</p>

                <!-- Animated Dashed Connector Line -->
                <div class="connector-line"></div>

                <!-- Step 2: AI Extracts (Text Left, Image Right) -->
                <div class="step-card zigzag-step reverse">
                    <div class="step-content">
                        <h3>AI extracts the details</h3>
                        <p>Amount, merchant, payment method, cash-flow — all structured automatically by our OCR & NLP models.</p>
                    </div>
                    <div class="step-visual">
                        <span class="step-badge">02</span>
                        <img src="/assests/ai_extraction.png" alt="AI extraction metadata display" class="step-img">
                    </div>
                </div>

                <!-- Animated Dashed Connector Line -->
                <div class="connector-line"></div>

                <!-- Step 3: Instant Clarity (Image Left, Text Right) -->
                <div class="step-card zigzag-step">
                    <div class="step-visual">
                        <span class="step-badge">03</span>
                        <img src="/assests/detailed_records.png" alt="Detailed spending breakdowns reports screen" class="step-img">
                    </div>
                    <div class="step-content">
                        <h3>Get instant clarity</h3>
                        <p>See categories, trends, and top spends across weekly or monthly views in real-time dashboards.</p>
                    </div>
                </div>
            </div>

            <!-- SECTION 4: Built for India -->
            <div class="built-for-india-section">
                <div class="india-badge-header">
                    <span class="decorative-line"></span>
                    <span class="badge-text">BUILT FOR INDIA</span>
                    <span class="decorative-line"></span>
                </div>

                <!-- Horizontal Infinite Chip Marquee -->
                <div class="marquee-scroller">
                    <div class="marquee-track">
                        <!-- Duplicate lists ensure seamless loop styling -->
                        <span class="marquee-chip"><span class="chip-dot"></span>UPI screenshots</span>
                        <span class="marquee-chip"><span class="chip-dot"></span>Receipt OCR</span>
                        <span class="marquee-chip"><span class="chip-dot"></span>Hinglish voice notes</span>
                        <span class="marquee-chip"><span class="chip-dot"></span>Auto categorization</span>
                        <span class="marquee-chip"><span class="chip-dot"></span>Cash flow detection</span>

                        <span class="marquee-chip"><span class="chip-dot"></span>Bank + wallet support</span>
                        <span class="marquee-chip"><span class="chip-dot"></span>Export anytime</span>
                        <!-- Seamless repeat -->
                        <span class="marquee-chip"><span class="chip-dot"></span>UPI screenshots</span>
                        <span class="marquee-chip"><span class="chip-dot"></span>Receipt OCR</span>
                        <span class="marquee-chip"><span class="chip-dot"></span>Hinglish voice notes</span>
                        <span class="marquee-chip"><span class="chip-dot"></span>Auto categorization</span>
                        <span class="marquee-chip"><span class="chip-dot"></span>Cash flow detection</span>
                        <span class="marquee-chip"><span class="chip-dot"></span>Merchant extraction</span>
                        <span class="marquee-chip"><span class="chip-dot"></span>Bank + wallet support</span>
                        <span class="marquee-chip"><span class="chip-dot"></span>Export anytime</span>
                    </div>
                </div>

                <!-- 4-Card Feature Grid -->
                <div class="feature-cards-grid">
                    <!-- Feature Card 1 -->
                    <div class="feature-grid-card">
                        <img src="/assests/multi_input.png" alt="Multi-input channel icon" class="feature-card-icon">
                        <h4>Multi-input</h4>
                        <p class="short-desc">Type, upload, or speak — all in one place.</p>
                        <p class="extended-desc">Seamlessly add expenses through text, voice notes in Hinglish, or by uploading receipt images. Choose the method that works best for you in the moment.</p>
                    </div>
                    <!-- Feature Card 2 -->
                    <div class="feature-grid-card">
                        <img src="/assests/input_extraction.png" alt="Extraction visual icon" class="feature-card-icon">
                        <h4>Accurate extraction</h4>
                        <p class="short-desc">Merchant, amount, method — pulled automatically.</p>
                        <p class="extended-desc">Our AI intelligently extracts merchant names, transaction amounts, payment methods, and categories from any input format without manual entry.</p>
                    </div>
                    <!-- Feature Card 3 -->
                    <div class="feature-grid-card">
                        <img src="/assests/categorization.png" alt="Categorization chart icon" class="feature-card-icon">
                        <h4>Smart categories</h4>
                        <p class="short-desc">Clean charts and reports, without manual cleanup.</p>
                        <p class="extended-desc">Automatically organize expenses into meaningful categories. Get instant insights through visual charts and detailed reports that help you understand spending patterns.</p>
                    </div>
                    <!-- Feature Card 4 -->
                    <div class="feature-grid-card">
                        <img src="/assests/privacy.png" alt="Privacy lock icon" class="feature-card-icon">
                        <h4>Private by default</h4>
                        <p class="short-desc">Your data stays yours. Built with security in mind.</p>
                        <p class="extended-desc">Your financial data is encrypted and stored securely. You have complete control to review, edit, export, or delete your information at any time.</p>
                    </div>
                </div>
            </div>

            <!-- SECTION 5: Built for Everyone (Bento Grid) -->
            <div class="built-for-everyone-section">
                <div class="section-header">
                    <h2>Built for everyone</h2>
                </div>

                <!-- Bento Layout Grid -->
                <div class="bento-grid">
                    <!-- Bento Card 1 -->
                    <div class="bento-card">
                        <img src="/assests/studet_image.png" alt="Students managing budgets" class="bento-card-img">
                        <div class="bento-card-content">
                            <h3>STUDENTS</h3>
                            <p>Track daily expenses, manage pocket money, and stay on budget effortlessly.</p>
                        </div>
                    </div>
                    <!-- Bento Card 2 -->
                    <div class="bento-card">
                        <img src="/assests/everyday_person.png" alt="Family managing expenses" class="bento-card-img">
                        <div class="bento-card-content">
                            <h3>EVERYDAY USERS</h3>
                            <p>Monitor household spending, bills, and personal finances in one place.</p>
                        </div>
                    </div>
                    <!-- Bento Card 3 -->
                    <div class="bento-card">
                        <img src="/assests/account_tracker.png" alt="Professional ledger summary screen" class="bento-card-img">
                        <div class="bento-card-content">
                            <h3>ACCOUNT TRACKERS</h3>
                            <p>Maintain detailed records, analyze patterns, and export data for reporting.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECTION 6: CTA Section -->
            <div class="cta-section">
                <div class="cta-banner">
                    <h2>Ready to take control?</h2>
                    <p class="cta-subtitle">Start tracking smarter, not harder.</p>
                    <a href="#chat" class="btn primary btn-cta-main">Get Started Free</a>
                </div>

                <!-- 3-Column CTA Highlights -->
                <div class="cta-features-grid">
                    <!-- Highlight 1 -->
                    <div class="cta-feature">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                            <polyline points="2 17 12 22 22 17"></polyline>
                            <polyline points="2 12 12 17 22 12"></polyline>
                        </svg>
                        <h3>Multi-Modal Input</h3>
                        <p>Text, voice, or images. UPI screenshots supported.</p>
                    </div>
                    <!-- Highlight 2 -->
                    <div class="cta-feature">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <h3>Real-Time Processing</h3>
                        <p>AI categorization with instant insights.</p>
                    </div>
                    <!-- Highlight 3 -->
                    <div class="cta-feature">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <h3>Bank-Level Security</h3>
                        <p>Encrypted and private. Never shared.</p>
                    </div>
                </div>
            </div>

            <!-- SECTION 7: FAQ Section (CSS Accordion using Details/Summary) -->
            <div class="faq-section">
                <div class="section-header">
                    <h2>Frequently Asked Questions</h2>
                </div>

                <div class="faq-accordion-container">
                    <details class="faq-item">
                        <summary class="faq-question">How does Fold automatically track my expenses? <span class="faq-arrow"></span></summary>
                        <div class="faq-answer">
                            <p>Fold integrates localized artificial intelligence engines like PaddleOCR (for reading details from uploaded invoice images or UPI transaction screenshot photos), Whisper (for transcribing voice note audio), and scikit-learn/transformers NLP model pipelines to automatically extract merchant, amount, payment method, and categories without manual data entry.</p>
                        </div>
                    </details>

                    <details class="faq-item">
                        <summary class="faq-question">Does Fold support Hinglish or local language inputs? <span class="faq-arrow"></span></summary>
                        <div class="faq-answer">
                            <p>Yes. Fold is tailor-made for Indian users. It utilizes a custom trained scikit-learn intent classifier and Named Entity Recognition parser capable of extracting parameters from Hinglish phrases like "Swiggy se 450 ka food order kiya UPI se" or "auto wale ko 50 cash diya".</p>
                        </div>
                    </details>

                    <details class="faq-item">
                        <summary class="faq-question">Is my financial data secure and private? <span class="faq-arrow"></span></summary>
                        <div class="faq-answer">
                            <p>Absolutely. Your privacy is our top priority. All uploaded assets are processed secure and stored within database layers protected by Clerk authentication gates. Your data is only visible to you, and we do not sell or share your transaction records with third parties.</p>
                        </div>
                    </details>

                    <details class="faq-item">
                        <summary class="faq-question">How do I connect my bank accounts? <span class="faq-arrow"></span></summary>
                        <div class="faq-answer">
                            <p>You can add bank institutions (e.g. HDFC, SBI Savings), credit cards, or cash wallets from the 🏦 Accounts tab. Our AI engines scan transaction references (like the last 4 digits of cards or bank names in messages) to map them to your designated bank accounts automatically.</p>
                        </div>
                    </details>

                    <details class="faq-item">
                        <summary class="faq-question">Can I export my data? <span class="faq-arrow"></span></summary>
                        <div class="faq-answer">
                            <p>Yes. You can review all transaction data inside the 📋 Transactions history panel and view aggregated insights inside the 📊 Reports page. All data can be extracted or exported easily for personal budgeting analyses.</p>
                        </div>
                    </details>
                </div>
            </div>

            <!-- SECTION 8: Footer -->
            <footer class="landing-footer">
                <div class="footer-grid-layout">
                    <div class="footer-brand-col">
                        <h3>Fold AI</h3>
                        <p class="footer-subtext">The next-generation multimodal ledger built for India.</p>
                    </div>
                    <div class="footer-links-col">
                        <h4>Product</h4>
                        <a href="#chat">Add Chat</a>
                        <a href="#transactions">History</a>
                        <a href="#reports">Analytics</a>
                    </div>
                    <div class="footer-links-col">
                        <h4>Security</h4>
                        <a href="#landing">Privacy Policy</a>
                        <a href="#landing">Terms of Service</a>
                    </div>
                </div>
                <div class="footer-bottom">
                    <p>&copy; 2026 Fold AI. All rights reserved. Built with pure HTML/CSS/JS.</p>
                </div>
            </footer>

        </section>
    </template>

    <!-- ============================================================ -->
    <!-- PAGE: Chat (Add Transaction) — markup only, JS in Module 20  -->
    <!-- ============================================================ -->
    <template id="tpl-chat">
        <section class="page chat-page">
            <h2>Add Transaction</h2>
            <div class="input-card">
                <textarea id="text-input" placeholder="Type your transaction (e.g. Spent 500 on groceries via UPI)…"></textarea>
                <div class="action-buttons">
                    <button id="record-btn" class="btn secondary">🎤 Record Audio</button>
                    <label for="image-input" class="btn secondary">📷 Upload Receipt</label>
                    <input type="file" id="image-input" accept="image/*" style="display:none;">
                    <button id="send-btn" class="btn primary">Send</button>
                </div>
            </div>
            <div id="status-area"></div>
            <div id="result-area"></div>
        </section>
    </template>

    <!-- ============================================================ -->
    <!-- PAGE: Transactions — markup only, JS in Module 21            -->
    <!-- ============================================================ -->
    <template id="tpl-transactions">
        <section class="page transactions-page">
            <h2>Transaction History</h2>
            <div id="tx-loading" class="loading-text">Loading transactions…</div>
            <table id="tx-table" class="data-table" style="display:none;">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Amount (₹)</th>
                        <th>Method</th>
                    </tr>
                </thead>
                <tbody id="tx-body"></tbody>
            </table>
            <p id="tx-empty" style="display:none;" class="empty-msg">No transactions yet. <a href="#chat">Add one now →</a></p>
        </section>
    </template>

    <!-- ============================================================ -->
    <!-- PAGE: Accounts — markup only, no dedicated module yet        -->
    <!-- ============================================================ -->
    <template id="tpl-accounts">
        <section class="page accounts-page">
            <h2>Bank Accounts</h2>
            <div class="add-account-form input-card">
                <h3>Add Account</h3>
                <div class="form-row">
                    <input type="text" id="acc-name" placeholder="Account name (e.g. HDFC Savings)">
                    <select id="acc-type">
                        <option value="bank">Bank</option>
                        <option value="cash">Cash</option>
                        <option value="credit">Credit Card</option>
                    </select>
                </div>
                <div class="form-row">
                    <input type="text" id="acc-institution" placeholder="Institution (optional)">
                    <input type="text" id="acc-last4" placeholder="Last 4 digits (optional)" maxlength="4">
                    <input type="number" id="acc-balance" placeholder="Opening balance (₹)" step="0.01">
                </div>
                <button id="acc-add-btn" class="btn primary">Add Account</button>
                <div id="acc-status"></div>
            </div>
            <div id="acc-loading" class="loading-text">Loading accounts…</div>
            <div id="acc-list"></div>
        </section>
    </template>

    <!-- ============================================================ -->
    <!-- PAGE: Reports — markup only, JS + Chart.js in Module 22      -->
    <!-- ============================================================ -->
    <template id="tpl-reports">
        <section class="page reports-page">
            <h2>Financial Reports</h2>
            <div class="report-controls">
                <select id="report-period">
                    <option value="monthly">This Month</option>
                    <option value="weekly">Last 7 Days</option>
                </select>
                <button id="report-refresh" class="btn secondary">Refresh</button>
                <button id="report-download-pdf" class="btn primary">Download PDF</button>
            </div>
            <div id="report-loading" class="loading-text">Loading report…</div>
            <div id="report-content" style="display:none;">
                <div class="summary-cards" id="summary-cards"></div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin: 2rem 0;">
                    <div class="chart-card">
                        <h3>Spending by Category</h3>
                        <canvas id="chart-category"></canvas>
                    </div>
                    <div class="chart-card">
                        <h3>Payment Methods</h3>
                        <canvas id="chart-payment"></canvas>
                    </div>
                </div>
                <div class="chart-card" style="margin: 2rem 0;">
                    <h3>Income vs Expense</h3>
                    <canvas id="chart-income-expense"></canvas>
                </div>
                <div class="chart-card" style="margin: 2rem 0;">
                    <h3>Account Balances</h3>
                    <canvas id="chart-accounts"></canvas>
                </div>
                <div class="breakdown-section">
                    <h3>Recent Transactions</h3>
                    <div id="report-recent-tx"></div>
                </div>
            </div>
        </section>
    </template>


    <!-- Entry point -->
    <script type="module" src="/js/main.js"></script>
</body>
</html>
